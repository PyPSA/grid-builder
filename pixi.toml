[workspace]
name = "grid_builder"
authors = ["See AUTHORS file"]
description = "A modular Snakemake workflow for constructing and validating power grid models using OpenStreetMap data."
license = "MIT"
readme = "README.md"
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-arm64"]
homepage = "https://www.modelblocks.org/"

[dependencies]
clio-tools = ">=2026.03.30"
conda = ">=25.0.0"
ipdb = ">=0.13.13"
ipykernel = ">=6.29.5"
pydantic = ">=2.0"
"ruamel.yaml" = ">=0.18"
mypy = ">=1.15.0"
pytest = ">=8.3.5"
python = ">=3.12"
ruff = ">=0.9.9"
snakefmt = ">=0.10.2"
snakemake-minimal = ">=9.19.0"
pytz = ">=2026.1.post1"
earth-osm = ">=3.0.2"
# geopandas/shapely/scipy/scikit-learn/reverse-geocode are all already in
# PyPSA-Earth's own envs/environment.yaml — no package is added here beyond
# that set (version bounds don't need to match Earth's exactly, just the
# set of packages).
geopandas = ">=1.0"
shapely = ">=2.0"
scipy = ">=1.13"
scikit-learn = ">=1.5"
reverse-geocode = ">=1.6"

[tasks]
test-unit = {cmd = "pytest tests/unit/"}
test-integration = {cmd = "pytest tests/integration_test.py"}
generate-config = {cmd = "python workflow/scripts/_schema.py"}
