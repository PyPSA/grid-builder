convention_version: v1.0.0
pathvars:
  snakemake_defaults:
    logs:
      default: <logs>
      description: Location of module logs.
    resources:
      default: <resources>
      description: Location of downloaded PBFs, retrieved OSM features, and cleaning intermediates.
    results:
      default: <results>
      description: Location of module results.
  user_resources: {}
  results:
    buses:
      default: <results>/network/csv/buses.csv
      description: Network buses.
    lines:
      default: <results>/network/csv/lines.csv
      description: Network lines.
    transformers:
      default: <results>/network/csv/transformers.csv
      description: Network transformers.
    buses_geojson:
      default: <results>/network/geojson/buses.geojson
      description: Network buses geojson.
    lines_geojson:
      default: <results>/network/geojson/lines.geojson
      description: Network lines geojson.
    transformers_geojson:
      default: <results>/network/geojson/transformers.geojson
      description: Network transformers geojson.
    stations_polygon:
      default: <results>/network/geojson/stations_polygon.geojson
      description: Network stations polygon.
    buses_polygon:
      default: <results>/network/geojson/buses_polygon.geojson
      description: Network buses polygon.
    map:
      default: <results>/map.html
      description: Network map.
wildcards: {}
