# Module Input-Output structure for automated docs generation
pathvars:
  snakemake_defaults:
    logs:
      default: "<logs>"
      description: location of snakemake log files.
    resources:
      default: "<resources>"
      description: >-
        Raw OSM files are written to osm/out/{country}_{feature}.csv and
        osm/out/{country}_{feature}.geojson. Clean features and generic
        network outputs are written below osm/clean and osm/build.
    results:
      default: "<results>"
      description: location of module result files.
  user_resources: {}
