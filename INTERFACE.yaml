# Module Input-Output structure for automated docs generation
pathvars:
  snakemake_defaults:
    logs:
      default: "<logs>"
      description: location of snakemake log files.
    resources:
      default: "<resources>"
      description: >-
        Retrieved OSM files are written to osm/out/{country}_{feature}.csv
        and osm/out/{country}_{feature}.geojson under this directory.
    results:
      default: "<results>"
      description: location of module result files.
  user_resources: {}
