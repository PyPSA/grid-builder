# Module data that users cannot modify: ordered, literal string corrections
# for known-bad OSM tag values, applied by clean.py's `_clean_*`
# functions before their general syntax cleanup. Order matters — a later
# entry can depend on an earlier one having already run — and each list is
# applied verbatim, so add new entries at the point in the sequence where
# they belong, not just at the end. `lower: true` marks where the original
# PyPSA-Eur code lowercases the column; for most columns that happens before
# any corrections, but `circuits` lowercases only after its first two
# (case-sensitive) corrections, so entries must stay in that exact order.
#
# Ported verbatim from PyPSA-Eur's clean_osm_data.py (fix-osm branch),
# including one inert entry: voltage's "400/220/110 kV'" pattern contains an
# uppercase V, but by the time it runs the column is already lowercased, so
# it can never match. Preserved as-is rather than "fixed" to keep behaviour
# identical to the reference.
#
# One deliberate deviation: PyPSA-Eur applies "low"/"minor"/"medium"/"med"/
# "m"/"high" as substring replacements (like everything else in this list),
# but they're meant to catch a tag whose *entire* value is that word (some
# OSM contributors classify voltage qualitatively instead of numerically).
# As a substring match, "m" in particular corrupts any unrelated freeform
# text containing the letter m - seen for real on a Philippines line tagged
# voltage="...Max Amperes 100 Amps...", where every stray "m" expanded into
# "33000" and produced a 30+ digit value that overflowed int64 downstream.
# `exact` (whole-value match) below fixes that without changing behaviour
# for any tag that's genuinely just "medium"/"m"/etc.

voltage:
  - lower: true
  - replace: ["400/220/110 kV'", "400000;220000;110000"]
  - replace: ["400/220/110/20_kv", "400000;220000;110000;20000"]
  - replace: ["2x25000", "25000;25000"]
  - replace: ["é", ";"]
  - replace: ["kvv/", ""]
  - replace: ["11000l400", "11000"]
  - replace: ["(temp 150000)", ""]
  - exact: ["low", "1000"]
  - exact: ["minor", "1000"]
  - exact: ["medium", "33000"]
  - exact: ["med", "33000"]
  - exact: ["m", "33000"]
  - exact: ["high", "150000"]
  - replace: ["23000-109000", "109000"]
  - replace: ["380000>220000", "380000;220000"]
  - replace: [":", ";"]
  - replace: ["<", ";"]
  - replace: [",", ";"]
  - replace: ["kv", "000"]
  - replace: ["kva", "000"]
  - replace: ["/", ";"]

circuits:
  - replace: ["partial", ""]
  - replace: ["1operator=RTE operator:wikidata=Q2178795", ""]
  - lower: true
  - replace: ["1,5", "3"]
  - replace: ["1/3", "1"]

cables:
  - lower: true
  - replace: ["1/3", "1"]
  - replace: ["3x2;2", "3"]

wires:
  - lower: true
  - replace: ["?", ""]
  - replace: ["trzyprzewodowe", "3"]
  - replace: ["pojedyńcze", "1"]
  - replace: ["single", "1"]
  - replace: ["double", "2"]
  - replace: ["triple", "3"]
  - replace: ["quad", "4"]
  - replace: ["fivefold", "5"]
  - replace: ["yes", "3"]
  - replace: ["1/3", "1"]
  - replace: ["3x2;2", "3"]
  - replace: ["_", ""]

frequency:
  - lower: true
  - replace: ["16.67", "16.7"]
  - replace: ["16,7", "16.7"]
  - replace: ["?", ""]
  - replace: ["hz", ""]
  - replace: [" ", ""]

date:
  - lower: true
  - replace: ["unknown", ""]
  - replace: ["approx", ""]
  - replace: ["c.", ""]
  - replace: ["circa", ""]
  - replace: ["about", ""]
  - replace: ["?", ""]
