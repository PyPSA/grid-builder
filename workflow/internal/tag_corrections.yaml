# Module data that users cannot modify: ordered, literal string corrections
# for known-bad OSM tag values, applied by clean.py's `_clean_*`
# functions before their general syntax cleanup. Order matters as a later
# entry can depend on an earlier one having already run. Each list is
# applied verbatim, so add new entries at the point in the sequence where
# they belong, not just at the end.
#
# The code merges the mappings from clean_osm_data:
# - global ones from PyPSA-Earth's (repl_circuits, repl_cables, repl_voltage) 
# - regional from PyPSA-Eur's regional values (fix-osm branch)
# Those cover values that encode arithmetic ("2x3", "3+3") or a range ("2-1") 
# which would otherwise turn into a concatenation, e.g. transformimg "2x3" 
# into 23 cables instead of 6. 

# Entries are `exact` (whole-value) rather than `replace` (substring) so they
# cannot corrupt a longer freeform tag that happens to contain them.
#
# The port includes one inert entry: voltage's "400/220/110 kV'" pattern contains an
# uppercase V, but by the time it runs the column is already lowercased, so
# it can never match. Preserved as-is rather than "fixed" to keep behaviour
# identical to the reference.
#
# NB PyPSA-Earth's float artefacts ("50.0" -> "50") are deliberately not ported,
# as they should be covered by earth_osm's GeoJSON round-trip usage of raw OSM
# strings. (TODO may need some additional checking).
#
# NB2 PyPSA-Eur applies "low"/"minor"/"medium"/"med"/"m"/"high" as substring 
# replacements,but they're meant to catch a tag whose *entire* value is that
# word as some OSM contributors classify voltage qualitatively instead of 
# numerically (TODO Needs verification with MapYourGrid colleagues). 

voltage:
  - lower: true

  - replace: ["400/220/110 kV'", "400000;220000;110000"]
  - replace: ["400/220/110/20_kv", "400000;220000;110000;20000"]
  - replace: ["2x25000", "25000;25000"]

  - replace: ["é", ";"]
  - replace: ["kvv/", ""]
  - replace: ["11000l400", "11000"]
  - replace: ["(temp 150000)", ""]
  - exact: ["19.1 kv", "19100"]
  - exact: ["2*220000", "220000;220000"]
  - exact: ["kv30", "30000"]
  - replace: ["23000-109000", "109000"]
  - replace: ["380000>220000", "380000;220000"]  

  - exact: ["low", "1000"]
  - exact: ["minor", "1000"]
  - exact: ["medium", "33000"]
  - exact: ["med", "33000"]
  - exact: ["m", "33000"]
  - exact: ["high", "150000"]

  - replace: [":", ";"]
  - replace: ["<", ";"]
  - replace: [",", ";"]
  - replace: ["kv", "000"]
  - replace: ["kva", "000"]
  - replace: ["/", ";"]

circuits:
  - replace: ["partial", ""]
  - replace: ["1operator=RTE operator:wikidata=Q2178795", ""]
  - lower: true

  - replace: ["1,5", "3"]
  - replace: ["1/3", "1"]
  # TODO Correct parsing may need some additonal checking
  - exact: ["2/3", "2"]
  - exact: ["2-1", "2"]

  - exact: ["1;1 disused", "1;0"]
  - exact: ["single", "1"]
  - exact: ["1.", "1"]

  # Keep `1` as a default for circuits
  - exact: ["`", "1"]
  - exact: ["^1", "1"]
  - exact: ["e", "1"]
  - exact: ["d", "1"]

cables:
  - lower: true
  - replace: ["1/3", "1"]
  - replace: ["3x2;2", "3"]
  # TODO Correct parsing may need some additonal checking
  - exact: ["3+3", "6"]
  - exact: ["6+1", "6"]
  - exact: ["2x3", "6"]
  - exact: ["3x2", "6"]
  - exact: ["2x2", "4"]
  - exact: ["2-1", "3"]
  - exact: ["1 (looped - haul & return) + 1 power wire", "1"]

  # Zero live conductors mean the way is a ground wire or a retired cable
  - exact: ["1 disused", "0"]
  - exact: ["ground", "0"]
  - exact: ["3;3 disused", "3;0"]

  - exact: ["single", "1"]
  - exact: ["triple", "3"]
  - exact: ["line", "1"]
  - exact: ["partial", "1"]
  - exact: ["`", "1"]
  - exact: ["^1", "1"]
  - exact: ["e", "1"]
  - exact: ["d", "1"]

wires:
  - lower: true
  - replace: ["?", ""]
  - replace: ["trzyprzewodowe", "3"]
  - replace: ["pojedyńcze", "1"]
  - replace: ["single", "1"]
  - replace: ["double", "2"]
  - replace: ["triple", "3"]
  - replace: ["quad", "4"]
  - replace: ["fivefold", "5"]
  - replace: ["yes", "3"]
  - replace: ["1/3", "1"]
  - replace: ["3x2;2", "3"]
  - replace: ["_", ""]

frequency:
  - lower: true

  - replace: ["16.67", "16.7"]
  - replace: ["16,7", "16.7"]
  - replace: ["?", ""]
  - replace: ["hz", ""]
  - replace: [" ", ""]

  - exact: ["50;50;16.716.7", "50;50;16.7;16.7"]

date:
  - lower: true

  - replace: ["unknown", ""]
  - replace: ["approx", ""]
  - replace: ["c.", ""]
  - replace: ["circa", ""]
  - replace: ["about", ""]
  - replace: ["?", ""]
