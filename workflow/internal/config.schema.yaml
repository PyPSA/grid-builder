$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for user-provided configuration files."
type: object
additionalProperties: false
properties:
  countries:
    description: Country or region slugs used across the workflow.
    type: array
    minItems: 1
    items:
      type: string
  retrieve:
    type: object
    additionalProperties: false
    required:
      - source
      - primary_name
      - features
      - force_redownload
      - mp
      - stream_backend
      - cache_primary
      - target_date
    properties:
      source:
        description: Retrieval backend for OSM data.
        type: string
        enum:
          - geofabrik
          - overpass
      features:
        description: OSM features to retrieve for each country.
        type: array
        minItems: 1
        items:
          type: string
      primary_name:
        description: Primary OSM theme to retrieve.
        type: string
      force_redownload:
        description: Force refresh of cached inputs inside earth_osm.
        type: boolean
      mp:
        description: Enable multiprocessing in earth_osm.
        type: boolean
      stream_backend:
        description: Use the streaming pipeline when available.
        type: boolean
      cache_primary:
        description: Cache the primary feature during retrieval.
        type: boolean
      target_date:
        description: Optional historical target date.
        type:
          - string
          - "null"
